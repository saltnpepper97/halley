[package]
name = "halley"
version = "0.7.0"
edition = "2024"
description = "Spatial Wayland compositor built around infinite workspace navigation"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[workspace]
resolver = "2"
members = ["halley-api", "halley-cli", "halley-config", "halley-core", "halley-ipc", "halley-lift", "halley-portal"]

[workspace.package]
authors = ["Dustin Pilgrim <dustin.pilgrim1997@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/saltnpepper97/halley"
homepage = "https://github.com/saltnpepper97/halley"
keywords = ["wayland", "compositor", "rust", "linux"]
categories = ["os::linux-apis", "gui"]

[dependencies]
smithay = { version = "0.7.0", git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef", default-features = false, features = [
  "backend_egl",
  "renderer_gl",
  "backend_session",
  "backend_session_libseat",
  "backend_drm",
  "backend_gbm",
  "backend_udev",
  "backend_libinput",
  "renderer_multi",
  "wayland_frontend",
  "use_system_lib",
  "desktop",
] }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef" }
calloop = "0.14.4"
cgmath = "0.18"
cosmic-text = { version = "0.19", features = ["swash"] }
eventline = "0.9.0"
futures-util = { version = "0.3", optional = true }
drm-ffi = "0.9.1"
halley-config = { version = "0.7.0", path = "halley-config" }
halley-core = { version = "0.6.1", path = "halley-core" }
halley-ipc = { version = "0.6.1", path = "halley-ipc" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
png = "0.17"
resvg = { version = "0.47", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
xcursor = "0.3"
x11rb = { version = "0.13.2", optional = true, features = ["xkb"] }
zbus = { version = "5.16", optional = true }
sd-notify = { version = "0.5", optional = true }

[features]
default = ["dbus", "systemd", "xwayland", "winit"]
# In-process D-Bus services, currently Halley's accessibility keyboard monitor.
dbus = ["dep:futures-util", "dep:zbus"]
# User-manager environment publishing and readiness notification.
systemd = ["dep:sd-notify"]
dinit = []
# Native XWayland server and window-manager integration.
xwayland = ["dep:x11rb", "smithay/xwayland"]
# Nested compositor backend for development and testing.
winit = ["smithay/backend_winit"]

[dev-dependencies]
wayland-client = "0.31.14"
# `staging` exposes the client bindings for the `ext-workspace-v1` global the
# wire tests drive; `unstable` covers the existing Smithay protocol tests.
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
sha2 = "0.10"

# Halley itself stays unoptimized so incremental rebuilds are fast, but the
# dependency graph (smithay, cosmic-text, resvg, image, png) is compiled with
# full optimization. Those crates do the per-frame and per-screenshot work, and
# at opt-level 0 they dominate the profile of a dogfooded dev session.
[profile.dev.package."*"]
opt-level = 3

[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "vendor/smithay" }
